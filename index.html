<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Lorax · Habla por los árboles</title>
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#2b1640; --naranja:#f08a24; --rosa:#ff6fa5; --amarillo:#ffd23a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Chewy','Comic Sans MS',cursive}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;display:block;border-radius:14px;box-shadow:0 0 60px #ff6fa555}
  #conectar{position:fixed;top:14px;right:14px;z-index:5;padding:10px 18px;border:3px solid #fff;border-radius:999px;
    background:var(--rosa);color:#fff;font:inherit;font-size:18px;cursor:pointer;box-shadow:0 4px 0 #b83d6e}
  #conectar:active{transform:translateY(3px);box-shadow:0 1px 0 #b83d6e}
  #conectar.oculto{display:none}
  #aviso{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#ffd9ea;font-size:15px;opacity:.8}
</style>
</head>
<body>
<button id="conectar">🔌 Conectar Arduino</button>
<canvas id="juego" width="960" height="540"></canvas>
<div id="aviso"></div>

<script>
/* ============================================================
   CONFIGURACIÓN (ajústalo si hace falta)
   Arduino: botón en pin 2 · potenciómetro en A0 · 9600 baudios
   ============================================================ */
const BAUDIOS = 9600;

/* ============================================================
   ENTRADA: Arduino por Web Serial (los datos NO se muestran)
   Formato que envía tu sketch:
   "Botón: PRESIONADO   |   Potenciómetro: 512"
   ============================================================ */
const entrada = { x: 0.5, boton: false, conectado: false };

function procesarLinea(linea){
  if (linea.includes('PRESIONADO')) entrada.boton = true;
  else if (linea.includes('Sin presionar')) entrada.boton = false;
  const m = linea.match(/(\d+)\s*$/);
  if (m){
    let v = Math.min(1023, parseInt(m[1], 10)) / 1023;
    entrada.x = v;
  }
}

const btnConectar = document.getElementById('conectar');
const aviso = document.getElementById('aviso');

if (!('serial' in navigator)){
  btnConectar.classList.add('oculto');
  aviso.textContent = 'Para usar el Arduino abre esta página en Chrome o Edge. Mientras tanto: ← → mover (o usa el ratón/slider) · Espacio saltar/doble salto · Tecla G golpear.';
}

btnConectar.addEventListener('click', async () => {
  try{
    const puerto = await navigator.serial.requestPort();
    await puerto.open({ baudRate: BAUDIOS });
    entrada.conectado = true;
    btnConectar.classList.add('oculto');
    aviso.textContent = '';
    const dec = new TextDecoderStream();
    puerto.readable.pipeTo(dec.writable);
    const lector = dec.readable.getReader();
    let buf = '';
    while (true){
      const { value, done } = await lector.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0){ procesarLinea(buf.slice(0, i)); buf = buf.slice(i + 1); }
    }
  }catch(e){
    entrada.conectado = false;
    btnConectar.classList.remove('oculto');
    aviso.textContent = 'No se pudo conectar. Cierra el Monitor Serie del IDE de Arduino y vuelve a intentarlo.';
  }
});

/* Respaldo con teclado para probar sin Arduino */
const teclas = {};
let clickRatón = false;
addEventListener('keydown', e => { teclas[e.code] = true; if (e.code === 'Space' || e.code === 'ArrowUp') e.preventDefault(); });
addEventListener('keyup',   e => { teclas[e.code] = false; });
addEventListener('click', () => { clickRatón = true; });

/* ============================================================
   AUDIO AMBIENTAL (generado, sin archivos) · tecla M = silenciar
   ============================================================ */
let audio = null, silencio = false;
function iniciarAudio(){
  if (audio) return;
  audio = new (window.AudioContext || window.webkitAudioContext)();
  const master = audio.createGain(); master.gain.value = 0.5; master.connect(audio.destination);
  audio.master = master;
  const escala = [0, 2, 4, 7, 9, 12, 14];
  let paso = 0;
  setInterval(() => {
    if (audio.state === 'suspended') audio.resume();
    const t = audio.currentTime;
    if (paso % 8 === 0){          // acorde suave de fondo
      [130.8, 196, 261.6].forEach(f => nota(f * (paso % 16 ? 0.89 : 1), t, 3.6, 'sine', 0.05));
    }
    if (Math.random() < 0.75){    // melodía pentatónica tipo caja de música
      const n = escala[Math.floor(Math.random() * escala.length)];
      nota(392 * Math.pow(2, n / 12), t, 1.4, 'triangle', 0.07);
    }
    paso++;
  }, 520);
}
function nota(f, t, dur, tipo, vol){
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = tipo; o.frequency.value = f;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audio.master);
  o.start(t); o.stop(t + dur + 0.1);
}
function sfx(tipo){
  if (!audio) return;
  const t = audio.currentTime;
  if (tipo === 'salto') { nota(330, t, .18, 'square', .06); nota(520, t + .05, .2, 'square', .05); }
  if (tipo === 'superSalto') { nota(440, t, .15, 'square', .07); nota(660, t + .08, .25, 'square', .07); nota(880, t + .15, .3, 'square', .06); }
  if (tipo === 'golpe') { nota(180, t, .2, 'sawtooth', .09); nota(120, t + .04, .25, 'sawtooth', .08); }
  if (tipo === 'semilla'){ nota(880, t, .25, 'triangle', .1); nota(1320, t + .08, .35, 'triangle', .08); }
  if (tipo === 'dano')  { nota(110, t, .4, 'sawtooth', .12); nota(80, t + .1, .5, 'sawtooth', .1); }
  if (tipo === 'no')    { nota(220, t, .1, 'square', .05); }
}
addEventListener('keydown', e => { if (e.code === 'KeyM' && audio){ silencio = !silencio; audio.master.gain.value = silencio ? 0 : 0.5; } });

/* ============================================================
   JUEGO
   ============================================================ */
const cv = document.getElementById('juego'), c = cv.getContext('2d');
const W = 960, H = 540, SUELO = 440;
const COLORES_TUFT = ['#ff6fa5', '#ffd23a', '#ff9f43', '#5fe0d0', '#c58bff'];

let estado = 'menu';          // menu · jugando · fin
let t = 0, vel, puntos, vidas, bosque, siguiente, invul, shake;
let enem, arbolitos, particulas, pollen;
const p = { x: 300, y: SUELO, vy: 0, suelo: true, ataque: 0, cd: 0 };
let botonPrev = false;
let potPrev = 0.5;
let saltosRealizados = 0;

const pollen0 = () => Array.from({ length: 50 }, () => ({
  x: Math.random() * W, y: Math.random() * SUELO, r: 1 + Math.random() * 2.5,
  v: 10 + Math.random() * 25, f: Math.random() * 6.28
}));
pollen = pollen0();

function reiniciar(){
  vel = 260; puntos = 0; vidas = 3; bosque = 0; siguiente = 1; invul = 0; shake = 0;
  enem = []; arbolitos = []; particulas = []; saltosRealizados = 0;
  Object.assign(p, { y: SUELO, vy: 0, suelo: true, ataque: 0, cd: 0 });
}
reiniciar();

/* ---------- lectura de controles ---------- */
function controles(dt){
  // El Lorax se queda en una posición fija horizontal (corriendo en su sitio)
  p.x = 300;

  // Detección del botón (Salto / Doble salto)
  const botonActual = entrada.boton || teclas.Space || teclas.ArrowUp || teclas.KeyW;
  const pulsoBoton = botonActual && !botonPrev;
  botonPrev = botonActual;

  // Detección del potenciómetro para golpear (cambio rápido de valor o tecla G / Click)
  const potActual = entrada.x;
  const cambioPot = Math.abs(potActual - potPrev) > 0.25; // Si se mueve rápido el potenciómetro
  potPrev = potActual;

  const pulsoGolpe = cambioPot || teclas.KeyG || clickRatón;
  clickRatón = false;

  return { pulsoBoton, pulsoGolpe };
}

/* ---------- bucle ---------- */
let ultimo = performance.now();
function bucle(ahora){
  const dt = Math.min(0.04, (ahora - ultimo) / 1000); ultimo = ahora; t += dt;
  const { pulsoBoton, pulsoGolpe } = controles(dt);
  if (pulsoBoton || pulsoGolpe) iniciarAudio();

  if (estado === 'menu'){ if (pulsoBoton || pulsoGolpe){ reiniciar(); estado = 'jugando'; } }
  else if (estado === 'fin'){ if ((pulsoBoton || pulsoGolpe) && t - tFin > 1){ reiniciar(); estado = 'jugando'; } }
  else actualizar(dt, pulsoBoton, pulsoGolpe);

  dibujar();
  requestAnimationFrame(bucle);
}
let tFin = 0;

function actualizar(dt, pulsoBoton, pulsoGolpe){
  vel = 260 + Math.min(260, puntos * 1.2);
  invul = Math.max(0, invul - dt); shake = Math.max(0, shake - dt * 3);

  // Gestión de saltos con el botón del pin 2
  if (p.suelo) {
    saltosRealizados = 0;
  }

  if (pulsoBoton) {
    if (p.suelo) {
      // Primer salto
      p.vy = -820;
      p.suelo = false;
      saltosRealizados = 1;
      sfx('salto');
    } else if (saltosRealizados === 1) {
      // Doble salto (salto más alto)
      p.vy = -1050;
      saltosRealizados = 2;
      sfx('superSalto');
      chispas(p.x, p.y, '#ffd23a', 10);
    }
  }

  // Gestión del golpe con el potenciómetro
  if (pulsoGolpe && p.cd <= 0){
    p.ataque = 0.32; 
    p.cd = 0.28;
  }

  p.cd -= dt; p.ataque = Math.max(0, p.ataque - dt);
  p.vy += 2200 * dt; p.y += p.vy * dt;
  if (p.y >= SUELO){ p.y = SUELO; p.vy = 0; p.suelo = true; saltosRealizados = 0; }

  /* aparición de enemigos y semillas */
  siguiente -= dt;
  if (siguiente <= 0){
    siguiente = Math.max(0.6, 1.5 - puntos / 400) + Math.random() * 0.9;
    const r = Math.random();
    if (r < 0.32) enem.push({ tipo: 'cortador', x: W + 60, y: SUELO, w: 56, h: 80 });
    else if (r < 0.58) enem.push({ tipo: 'humo', x: W + 60, y: SUELO - 90 - Math.random() * 60, w: 90, h: 56, f: Math.random() * 6 });
    else if (r < 0.78) enem.push({ tipo: 'tocon', x: W + 60, y: SUELO, w: 54, h: 44 });
    else enem.push({ tipo: 'semilla', x: W + 60, y: SUELO - 50 - Math.random() * 170, w: 30, h: 30, f: Math.random() * 6 });
  }

  /* zona de golpe y cuerpo del Lorax */
  const golpe = p.ataque > 0 ? { x1: p.x + 10, x2: p.x + 140, y1: p.y - 120, y2: p.y + 10 } : null;
  const cuerpo = { x1: p.x - 24, x2: p.x + 24, y1: p.y - 84, y2: p.y };

  for (const e of enem){
    e.x -= vel * (e.tipo === 'cortador' ? 1.15 : 1) * dt;
    if (e.tipo === 'humo') e.y += Math.sin(t * 3 + e.f) * 40 * dt;
    if (e.tipo === 'semilla') e.y += Math.sin(t * 4 + e.f) * 30 * dt;
    const caja = { x1: e.x - e.w / 2, x2: e.x + e.w / 2, y1: e.y - e.h, y2: e.y };
    if (e.tipo === 'humo') { caja.y1 = e.y - e.h / 2; caja.y2 = e.y + e.h / 2; }
    if (e.tipo === 'semilla') { caja.y1 = e.y - 15; caja.y2 = e.y + 15; }
    const toca = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;

    if (golpe && toca(golpe, caja) && e.tipo !== 'semilla'){
      if (e.tipo === 'tocon'){ if (!e.nope){ e.nope = true; sfx('no'); chispas(e.x, e.y - 30, '#fff', 6); } }
      else {
        e.muerto = true; puntos += 10; sfx('golpe'); shake = 0.5;
        chispas(e.x, e.y - 30, e.tipo === 'humo' ? '#8a7f99' : '#ffb347', 16);
        arbolitos.push({ x: e.x, nace: t }); bosque++;
      }
    } else if (toca(cuerpo, caja)){
      if (e.tipo === 'semilla'){
        e.muerto = true; puntos += 5; sfx('semilla'); chispas(e.x, e.y, '#ffd23a', 12);
      } else if (invul <= 0){
        vidas--; invul = 1.4; shake = 1; sfx('dano'); e.muerto = true;
        chispas(p.x, p.y - 40, '#ff4d4d', 14);
        if (vidas <= 0){ estado = 'fin'; tFin = t; }
      }
    }
    if (e.x < -120) e.muerto = true;
  }
  enem = enem.filter(e => !e.muerto);
  for (const a of arbolitos) a.x -= vel * dt;
  arbolitos = arbolitos.filter(a => a.x > -80);
  puntos += dt * 2;
}

function chispas(x, y, col, n){
  for (let i = 0; i < n; i++)
    particulas.push({ x, y, vx: (Math.random() - .5) * 420, vy: -Math.random() * 380, vida: 0.6 + Math.random() * 0.4, col });
}

/* ============================================================
   DIBUJO
   ============================================================ */
function dibujar(){
  c.save();
  if (shake > 0) c.translate((Math.random() - .5) * shake * 10, (Math.random() - .5) * shake * 10);
  cielo(); sol();
  capaArboles(0.15, 0.55, 380, 70, 0);
  capaArboles(0.4, 0.8, 410, 100, 1);
  suelo();
  for (const a of arbolitos) arbolito(a.x, SUELO, Math.min(1, (t - a.nace) / 2));
  for (const e of enem) dibujarEnemigo(e);
  if (estado !== 'menu') lorax();
  else { p.x = 300; loraxMenu(); }
  polen();
  for (const q of particulas){ q.x += q.vx / 60; q.y += q.vy / 60; q.vy += 14; q.vida -= 1 / 60; }
  particulas = particulas.filter(q => q.vida > 0);
  for (const q of particulas){ c.globalAlpha = Math.max(0, q.vida); c.fillStyle = q.col; c.beginPath(); c.arc(q.x, q.y, 4, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  c.restore();
  hud();
  if (estado === 'menu') pantallaMenu();
  if (estado === 'fin') pantallaFin();
}

function cielo(){
  const g = c.createLinearGradient(0, 0, 0, SUELO);
  g.addColorStop(0, '#8e5bd1'); g.addColorStop(.45, '#ff8fb8'); g.addColorStop(1, '#ffd9a0');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
function sol(){
  const g = c.createRadialGradient(720, 300, 20, 720, 300, 220);
  g.addColorStop(0, 'rgba(255,240,170,1)'); g.addColorStop(.35, 'rgba(255,190,100,.8)'); g.addColorStop(1, 'rgba(255,150,120,0)');
  c.fillStyle = g; c.fillRect(400, 80, 640, 440);
}
function suelo(){
  const g = c.createLinearGradient(0, SUELO, 0, H);
  g.addColorStop(0, '#59d6a4'); g.addColorStop(1, '#1f8f7a');
  c.fillStyle = g; c.fillRect(0, SUELO, W, H - SUELO);
  c.fillStyle = '#8ff0c0';
  for (let i = -1; i < 30; i++){
    const x = ((i * 40 - (t * vel * 1) % 40) + W * 2) % (W + 40) - 20;
    c.beginPath(); c.moveTo(x, SUELO); c.lineTo(x + 8, SUELO - 12); c.lineTo(x + 16, SUELO); c.fill();
  }
}

function tuft(x, y, r, col){
  c.fillStyle = col;
  for (let i = 0; i < 9; i++){
    const a = i / 9 * 6.28 + 0.3;
    c.beginPath(); c.arc(x + Math.cos(a) * r * .75, y + Math.sin(a) * r * .75, r * .42, 0, 7); c.fill();
  }
  c.beginPath(); c.arc(x, y, r * .8, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(x - r * .25, y - r * .25, r * .3, 0, 7); c.fill();
}
function truffula(x, base, alto, col, ancho){
  c.fillStyle = '#ff9f43'; c.fillRect(x - ancho / 2, base - alto, ancho, alto);
  c.fillStyle = '#fff3d6';
  for (let y = base - alto + 8; y < base; y += 20) c.fillRect(x - ancho / 2, y, ancho, 8);
  c.strokeStyle = '#7a4a2a'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(x, base - alto); c.quadraticCurveTo(x + 6, base - alto - 20, x + 2, base - alto - 40); c.stroke();
  tuft(x + 2, base - alto - 50, ancho * 1.5, col);
}
function capaArboles(factor, alfa, base, alto, k){
  c.globalAlpha = alfa;
  const sep = 190, off = (t * vel * factor) % sep;
  for (let i = -1; i < 7; i++){
    const idx = Math.floor((t * vel * factor) / sep) + i;
    const x = i * sep - off + 60;
    const h = alto + ((idx * 37) % 5) * 22;
    truffula(x, base + 30, h, COLORES_TUFT[Math.abs(idx + k * 2) % 5], 16 + k * 8);
  }
  c.globalAlpha = 1;
}
function arbolito(x, y, k){
  const s = 0.2 + k * 0.8;
  c.fillStyle = '#ff9f43'; c.fillRect(x - 5 * s, y - 70 * s, 10 * s, 70 * s);
  tuft(x, y - 80 * s, 24 * s, COLORES_TUFT[Math.floor(x / 7) % 5 < 0 ? 0 : Math.abs(Math.floor(x / 7)) % 5]);
}
function polen(){
  for (const q of pollen){
    q.x -= q.v * 0.02; q.y += Math.sin(t * 1.5 + q.f) * 0.4;
    if (q.x < -5) { q.x = W + 5; q.y = Math.random() * SUELO; }
    c.globalAlpha = 0.5 + 0.5 * Math.sin(t * 3 + q.f);
    c.fillStyle = '#fff6b0'; c.beginPath(); c.arc(q.x, q.y, q.r, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
}

/* ---------- el Lorax ---------- */
function loraxMenu(){ p.y = SUELO + Math.sin(t * 3) * 4; lorax(true); p.y = SUELO; }
function lorax(menu){
  const parpadeo = invul > 0 && Math.floor(t * 20) % 2 === 0 && !menu;
  if (parpadeo) return;
  c.save(); c.translate(p.x, p.y);
  const aire = !p.suelo;
  const sq = aire ? 1.08 : 1 + Math.sin(t * 14) * 0.02;
  c.scale(1 / sq, sq);
  // sombra
  c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(0, 4 + (SUELO - p.y) * 0, 30, 6, 0, 0, 7); c.fill();
  // pies
  c.fillStyle = '#d9631a';
  c.beginPath(); c.ellipse(-14, -4, 14, 7, 0, 0, 7); c.ellipse(14, -4, 14, 7, 0, 0, 7); c.fill();
  // cuerpo peludo
  c.fillStyle = '#f08a24';
  c.beginPath(); c.ellipse(0, -38, 30, 36, 0, 0, 7); c.fill();
  for (let i = 0; i < 16; i++){
    const a = i / 16 * 6.28;
    c.beginPath(); c.arc(Math.cos(a) * 30, -38 + Math.sin(a) * 36, 7, 0, 7); c.fill();
  }
  c.fillStyle = '#ffb25a'; c.beginPath(); c.ellipse(0, -28, 18, 22, 0, 0, 7); c.fill();
  // cabeza / mechón
  c.fillStyle = '#f08a24';
  c.beginPath(); c.moveTo(-6, -76); c.lineTo(0, -92 - Math.sin(t * 6) * 2); c.lineTo(6, -76); c.fill();
  // brazo
  c.strokeStyle = '#e07a1a'; c.lineCap = 'round'; c.lineWidth = 11;
  c.beginPath(); c.moveTo(22, -46);
  if (p.ataque > 0){
    const k = 1 - p.ataque / 0.32, ang = -1.2 + k * 2.2;
    c.lineTo(22 + Math.cos(ang) * 58, -46 + Math.sin(ang) * 58); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 6;
    c.beginPath(); c.arc(22, -46, 62, -1.3, ang); c.stroke();
    c.strokeStyle = 'rgba(255,230,120,.7)'; c.lineWidth = 3;
    c.beginPath(); c.arc(22, -46, 78, -1.3, ang); c.stroke();
  } else { c.lineTo(34, -30 + Math.sin(t * 8) * 3); c.stroke(); }
  c.beginPath(); c.moveTo(-22, -46); c.lineTo(-34, -30); c.stroke();
  // ojos
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(-9, -60, 9, 0, 7); c.arc(10, -60, 9, 0, 7); c.fill();
  c.fillStyle = '#222';
  c.beginPath(); c.arc(-6, -59, 4, 0, 7); c.arc(13, -59, 4, 0, 7); c.fill();
  c.strokeStyle = '#a24c0c'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(-18, -72); c.lineTo(-3, -69); c.moveTo(20, -72); c.lineTo(3, -69); c.stroke();
  // bigote
  c.fillStyle = '#ffd23a'; c.strokeStyle = '#e0a800'; c.lineWidth = 2;
  for (const s of [-1, 1]){
    c.beginPath(); c.ellipse(s * 17, -44, 24, 11, s * 0.35, 0, 7); c.fill(); c.stroke();
  }
  c.beginPath(); c.ellipse(0, -48, 9, 8, 0, 0, 7); c.fill();
  c.restore();
}

/* ---------- enemigos y objetos ---------- */
function dibujarEnemigo(e){
  c.save(); c.translate(e.x, e.y);
  if (e.tipo === 'cortador'){            // máquina talaárboles del Once-ler
    c.fillStyle = '#6a5b6e'; c.fillRect(-26, -62, 52, 50);
    c.fillStyle = '#3d3347'; c.fillRect(-30, -70, 60, 12);
    c.fillStyle = '#ffd23a'; c.fillRect(-14, -54, 28, 12);
    c.fillStyle = '#222'; c.fillRect(-9, -52, 5, 7); c.fillRect(4, -52, 5, 7);
    c.fillStyle = '#3d3347'; c.beginPath(); c.arc(-16, -8, 10, 0, 7); c.arc(16, -8, 10, 0, 7); c.fill();
    c.save(); c.translate(-34, -34); c.rotate(t * 18);
    c.fillStyle = '#ddd';
    for (let i = 0; i < 8; i++){ c.rotate(.785); c.beginPath(); c.moveTo(14, -4); c.lineTo(26, 0); c.lineTo(14, 4); c.fill(); }
    c.beginPath(); c.arc(0, 0, 14, 0, 7); c.fill(); c.restore();
  }
  if (e.tipo === 'humo'){                // nube de smog enojada
    c.fillStyle = '#5b5068';
    for (const [x, y, r] of [[-26, 4, 20], [0, -8, 26], [26, 4, 20], [0, 10, 22]]){ c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
    c.fillStyle = '#ffe14d';
    c.beginPath(); c.arc(-9, -6, 5, 0, 7); c.arc(9, -6, 5, 0, 7); c.fill();
    c.strokeStyle = '#1d1624'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-16, -16); c.lineTo(-4, -10); c.moveTo(16, -16); c.lineTo(4, -10); c.stroke();
  }
  if (e.tipo === 'tocon'){               // tocón: hay que saltarlo
    c.fillStyle = '#7a4a2a'; c.fillRect(-24, -40, 48, 40);
    c.fillStyle = '#d9a066'; c.beginPath(); c.ellipse(0, -40, 24, 9, 0, 0, 7); c.fill();
    c.strokeStyle = '#8a5a30'; c.lineWidth = 2;
    c.beginPath(); c.ellipse(0, -40, 14, 5, 0, 0, 7); c.stroke();
    c.beginPath(); c.ellipse(0, -40, 6, 2.5, 0, 0, 7); c.stroke();
    if (e.nope){ c.fillStyle = '#fff'; c.font = '22px Chewy, cursive'; c.textAlign = 'center'; c.fillText('¡salta!', 0, -62); }
  }
  if (e.tipo === 'semilla'){             // semilla de Truffula
    const g = c.createRadialGradient(0, 0, 2, 0, 0, 26);
    g.addColorStop(0, '#fff6b0'); g.addColorStop(.4, '#ff9fd0'); g.addColorStop(1, 'rgba(255,111,165,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 26 + Math.sin(t * 6) * 3, 0, 7); c.fill();
    c.fillStyle = '#ff6fa5'; c.beginPath(); c.ellipse(0, 0, 9, 13, 0.4, 0, 7); c.fill();
  }
  c.restore();
}

/* ---------- interfaz ---------- */
function titulo(txt, x, y, tam, col){
  c.font = `${tam}px Chewy, 'Comic Sans MS', cursive`; c.textAlign = 'center';
  c.lineWidth = tam / 6; c.strokeStyle = '#4a1d5e'; c.lineJoin = 'round';
  c.strokeText(txt, x, y); c.fillStyle = col; c.fillText(txt, x, y);
}
function hud(){
  if (estado === 'menu') return;
  for (let i = 0; i < 3; i++){
    c.globalAlpha = i < vidas ? 1 : 0.25;
    tuft(40 + i * 46, 38, 14, '#ff6fa5');
    c.fillStyle = '#ff9f43'; c.fillRect(37 + i * 46, 50, 6, 14);
  }
  c.globalAlpha = 1;
  titulo('Puntos ' + Math.floor(puntos), W - 120, 44, 30, '#ffd23a');
  titulo('🌳 ' + bosque, W / 2, 44, 30, '#9bffd0');
}
function pantallaMenu(){
  c.fillStyle = 'rgba(40,15,60,.35)'; c.fillRect(0, 0, W, H);
  titulo('EL LORAX', W / 2, 140, 110, '#ff9f43');
  titulo('«Yo hablo por los árboles»', W / 2, 195, 34, '#fff3d6');
  titulo('Botón (Pin 2)  →  Saltar (Pulsa 2 veces rápido para salto alto)', W / 2, 275, 26, '#9bffd0');
  titulo('Potenciómetro (A0)  →  Golpear obstáculos', W / 2, 320, 26, '#ffd23a');
  titulo('Pega al humo y a las máquinas, salta los tocones,', W / 2, 375, 22, '#fff');
  titulo('recoge semillas… ¡y planta un árbol por cada victoria!', W / 2, 403, 22, '#fff');
  if (Math.floor(t * 2) % 2 === 0) titulo('Pulsa el botón para empezar', W / 2, 485, 34, '#ff6fa5');
}
function pantallaFin(){
  c.fillStyle = 'rgba(40,15,60,.55)'; c.fillRect(0, 0, W, H);
  titulo('¡Los árboles te necesitan!', W / 2, 190, 60, '#ff9f43');
  titulo(`Puntos: ${Math.floor(puntos)}   ·   Árboles plantados: ${bosque}`, W / 2, 265, 32, '#fff3d6');
  titulo('«A menos que alguien como tú se preocupe…»', W / 2, 325, 26, '#9bffd0');
  if (t - tFin > 1 && Math.floor(t * 2) % 2 === 0) titulo('Pulsa el botón para intentarlo otra vez', W / 2, 440, 32, '#ff6fa5');
}

requestAnimationFrame(bucle);
